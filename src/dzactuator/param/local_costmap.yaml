local_costmap:
  global_frame: map 
  robot_base_frame: base_link 
  update_frequency: 5.0 
  publish_frequency: 5.0 
  transform_tolerance: 0.25
  rolling_window: true
  width: 1.0
  height: 1.0
  resolution: 0.05
  
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}       # SLAM 静态墙体
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}   # 保留插件，costmap_common 中 enabled: false
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}  # 墙体膨胀缓冲
